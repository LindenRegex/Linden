<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linden regex explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inria+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Iosevka/11.1.1/iosevka/iosevka.min.css" integrity="sha512-3hU20586NsplKRzjf2jQN5vTRTI2EsXObrHDOBLGdkiRkneg699BlmBXWGHHFHADCF3TOk2BREsVy7qTkmvQqQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Linden regex explorer</h1>

    <div id="console">
      <code class="line">
        <span class="prompt">&gt;&gt;</span>
        <span class="lead">s = JSON.parse('</span>
        <span class="delim-str">"</span>
        <textarea id="string" rows="1" spellcheck="false" autocapitalize="off">abc</textarea>
        <span class="delim-str">"</span>
        <span class="lead">')</span>
      </code>
      <code class="line">
        <span class="prompt">&gt;&gt;</span>
        <span class="lead">r = </span>
        <span class="delim-rx">/</span>
        <textarea id="regex" rows="1" spellcheck="false" autocapitalize="off">(?:a|(?:a(b)|a))bc</textarea>
        <span class="delim-rx">/</span>
        <span id="regex-flags">
          <input type="checkbox" id="flag-hasIndices" checked>
          <label class="flag-indicator" for="flag-hasIndices">d</label>

          <input type="checkbox" id="flag-global">
          <label class="flag-indicator flag-unavailable" for="flag-global">g</label>

          <input type="checkbox" id="flag-ignoreCase">
          <label class="flag-indicator" for="flag-ignoreCase">i</label>

          <input type="checkbox" id="flag-multiline">
          <label class="flag-indicator" for="flag-multiline">m</label>

          <input type="checkbox" id="flag-dotAll">
          <label class="flag-indicator" for="flag-dotAll">s</label>

          <input type="checkbox" id="flag-unicode">
          <label class="flag-indicator flag-unavailable" for="flag-unicode">u</label>

          <input type="checkbox" id="flag-unicodeSets">
          <label class="flag-indicator flag-unavailable" for="flag-unicodeSets">v</label>

          <input type="checkbox" id="flag-sticky" checked>
          <label class="flag-indicator" for="flag-sticky">y</label>
        </span>
      </code>
      <samp id="regex-error"></samp>
      <samp id="regex-view"></samp>
      <code class="line">
        <span class="prompt">&gt;&gt;</span>
        <span id="sticky-prefix">
          <span class="lead">r.lastIndex = </span>
          <input id="last-index" type="number" min="0" value="0" />
          <span class="lead">; </span>
        </span>
        <span class="lead">r.exec(s)</span>
      </code>
      <samp id="exec-result"></samp>
    </div>

    <div id="panes">
      <div id="tree"></div>
      <div id="state"></div>
    </div>

    <footer>
      <a href="https://lindenregex.github.io/" target="_blank">Linden: towards a formally verified, linear-time, efficient engine for JavaScript regexes</a>
    </footer>

    <script src="./linden-viz.js"></script>
  </body>
</html>
