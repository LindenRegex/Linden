name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check Linden
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: true

      - name: Install opam dependencies
        run: |
          # keep the refs in sync with the README
          opam pin add --no-action warblre.0.1.0 https://github.com/epfl-systemf/Warblre.git#a5a312072b892f4fb0343b8c2ac9d35d451c84f1
          opam pin add --no-action strict-order-solver.0.1.0 https://github.com/epfl-systemf/StrictOrderSolver.git#6f8de4a8c3c694928c4a6e31f798d0e387f8d90f
          opam install . --deps-only

      - name: Dune build
        run: opam exec -- dune build

      - name: Check compiled libraries (rocqchk)
        run: opam exec -- rocqchk -silent --output-context -R _build/default Linden _build/default/*/*.vo
